AllCops:
  NewCops: enable
  TargetRubyVersion: 3.4
  Exclude:
    - vendor/**/*

Style/Documentation:
  Enabled: false

Style/ArgumentsForwarding:
  # Preserve named forwarding when raising the supported Ruby syntax target.
  UseAnonymousForwarding: false

Metrics/BlockLength:
  Exclude:
    - spec/**/*

Gemspec/DevelopmentDependencies:
  EnforcedStyle: Gemfile

Metrics/ParameterLists:
  Max: 6

Metrics/MethodLength:
  Max: 15
