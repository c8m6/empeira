changelog:
  exclude:
    labels: [skip-release-notes]
  categories:
    - title: Features
      labels: [enhancement, feature]
    - title: Bug Fixes
      labels: [bug]
    - title: Performance
      labels: [performance]
    - title: Maintenance / Refactoring
      labels: [maintenance, refactor, dependencies]
    - title: Documentation
      labels: [documentation]
    - title: Other Changes
      labels: ['*']
