name: Dispatch release request

# Owner-created issues are an explicit release control, not source changes.
on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: write

concurrency:
  group: release-request
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.repository == 'c8m6/empeira' &&
      github.ref == 'refs/heads/main' &&
      github.event.issue.author_association == 'OWNER' &&
      github.event.issue.user.id == 35730763 &&
      github.event.sender.id == 35730763 &&
      startsWith(github.event.issue.title, 'Release request: ')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate owner release request
        id: request
        run: ruby script/release_request.rb
      - name: Dispatch existing validated release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.request.outputs.tag }}
          RELEASE_CHANNEL: ${{ steps.request.outputs.channel }}
          RELEASE_DRY_RUN: ${{ steps.request.outputs.dry_run }}
        run: |
          gh workflow run release.yml --ref main \
            -f "tag=$RELEASE_TAG" \
            -f "channel=$RELEASE_CHANNEL" \
            -f "dry_run=$RELEASE_DRY_RUN"
