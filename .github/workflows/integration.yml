name: Manual runtime integration

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Integration scope (full excludes accelerated VM suites)
        type: choice
        options: [containers, services, nodes, network, images, lifecycle, mounts, development, node-tools, modules, update-plane, browser, vm, dns-nodes, shared-network, full]
        default: containers
      runtime:
        description: Container runtime to validate
        type: choice
        options: [podman, docker]
        default: podman

permissions:
  contents: read

jobs:
  integration:
    # VM jobs run only on a dedicated disposable host with verified acceleration.
    runs-on: ${{ contains(fromJSON('["vm","dns-nodes","shared-network"]'), inputs.scope) && fromJSON('["self-hosted","linux","X64","empeira-vm"]') || fromJSON('["ubuntu-24.04"]') }}
    timeout-minutes: 120
    env:
      EMPEIRA_TEST_SCOPE: ${{ inputs.scope }}
      EMPEIRA_REQUIRED_RUNTIMES: ${{ inputs.runtime }}
      EMPEIRA_VM_RUNTIME: ${{ inputs.runtime }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Install hosted Podman prerequisites
        if: inputs.runtime == 'podman' && !contains(fromJSON('["vm","dns-nodes","shared-network"]'), inputs.scope)
        run: sudo apt-get update && sudo apt-get install -y podman netavark
      - name: Execute only the requested scope and runtime
        run: bundle exec ruby script/integration.rb
