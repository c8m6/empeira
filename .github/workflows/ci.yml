name: CI

on:
  push:
    branches: [main, initial]
  pull_request:
    branches: [main, initial]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.2', '3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Use Bundler 4 for Ruby 4 to avoid RubyGems constant warnings
        if: matrix.ruby == '4.0'
        run: |
          gem install bundler -v 4.0.22 --no-document
          sed -i 's/^  2\.6\.9$/  4.0.22/' Gemfile.lock resources/modules/Gemfile.lock
          bundle _4.0.22_ install
      - name: Check Ruby syntax including entrypoints, helpers and tests
        run: |
          ruby -c empeira.gemspec
          ruby -c bin/empeira
          find lib spec script resources -type f -name '*.rb' -print0 | xargs -0 -n 1 ruby -c > /dev/null
      - run: bundle exec rspec --exclude-pattern 'spec/integration/**/*_spec.rb'
      - if: matrix.ruby == '3.4'
        run: bundle exec rubocop
      - if: matrix.ruby == '3.4'
        run: bundle exec bundler-audit check --update
      - if: matrix.ruby == '3.4'
        run: bundle exec bundler-audit check --gemfile-lock resources/modules/Gemfile.lock
