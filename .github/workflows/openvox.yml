name: OpenVox end-to-end

on:
  pull_request:
    branches: [main, initial]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: openvox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        ruby: ['3.1', '3.2', '3.3', '3.4', '4.0']
    env:
      EMPEIRA_INTEGRATION: '1'
      EMPEIRA_REQUIRED_RUNTIMES: docker
      BUNDLER_VERSION: ${{ matrix.ruby == '4.0' && '4.0.22' || '2.6.9' }}
      BUNDLE_FROZEN: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: ${{ env.BUNDLER_VERSION }}
          bundler-cache: true
      - name: Configure the public Docker Hub cache on the hosted runner
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/empeira-smoke-docker"
          printf 'DOCKER_CONFIG=%s\n' "$DOCKER_CONFIG" >> "$GITHUB_ENV"
          install -d -m 0700 "$DOCKER_CONFIG"
          bundle exec ruby script/ci_docker_mirror.rb configure /etc/docker/daemon.json > "$RUNNER_TEMP/docker-daemon.json"
          sudo install -d -m 0755 /etc/docker
          sudo install -m 0600 "$RUNNER_TEMP/docker-daemon.json" /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{json .RegistryConfig.Mirrors}}' | bundle exec ruby script/ci_docker_mirror.rb verify
      - name: Verify AMD64 Docker engine
        run: |
          test "$(docker info --format '{{.Architecture}}')" = x86_64
          docker version
      - name: Apply a real Hiera catalog and verify idempotence, PuppetDB and cleanup
        run: >-
          bundle exec rspec spec/integration/node_spec.rb
          --example 'docker runs the default OpenVox node' --format documentation
      - name: Report bounded Docker daemon diagnostics on failure
        if: failure()
        run: |
          # Ruby reads stdin; the shell must preserve $stdin.
          # shellcheck disable=SC2016
          sudo journalctl --unit=docker --lines=40 --no-pager | bundle exec ruby -Ilib -rempeira -e 'puts Empeira::Execution::Diagnostics.bounded(Empeira::Execution::Diagnostics.safe_text($stdin.read))'
